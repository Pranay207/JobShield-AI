<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobShield Copilot</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
      }
      main { padding: 14px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; }
      .logo { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 10px; background: #172554; color: white; font-size: 12px; }
      p { color: #64748b; font-size: 13px; line-height: 1.45; }
      label { display: block; margin-top: 10px; font-size: 12px; font-weight: 800; color: #334155; }
      input[type="text"] { box-sizing: border-box; width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; margin-top: 5px; padding: 9px; font-size: 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; border-radius: 10px; background: #f8fafc; padding: 9px; font-size: 13px; font-weight: 800; }
      button { width: 100%; border: 0; border-radius: 10px; background: #172554; color: white; cursor: pointer; font-weight: 900; padding: 10px; margin-top: 10px; }
      .secondary { background: #e2e8f0; color: #0f172a; }
      .status { min-height: 16px; margin-top: 8px; color: #166534; font-size: 12px; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="logo">JS</div>
        <div>JobShield Copilot</div>
      </div>
      <p>Scans visible job messages, highlights risky phrases, and can run the full JobShield AI scan through Supabase.</p>

      <div class="row">
        <span>AI scan via Supabase</span>
        <input id="aiEnabled" type="checkbox" />
      </div>

      <label for="appUrl">JobShield app URL</label>
      <input id="appUrl" type="text" placeholder="http://127.0.0.1:5173" />

      <button id="save">Save settings</button>
      <button id="open" class="secondary">Open JobShield</button>
      <div id="status" class="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
